name: Release Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: |
          cd dist
          zip -r "../techtab-${{ github.ref_name }}.zip" . -x ".*"
      # gh CLI (preinstalled on the runner) instead of softprops/action-gh-release —
      # the repo's Actions allowlist permits github-owned actions only.
      - run: gh release create "${{ github.ref_name }}" "techtab-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
